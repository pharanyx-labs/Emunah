# Emunah -- Anti-theft.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp antitheft` explains each setting; the values shown are the defaults.

# antitheft.enabled = true

# Alert when an item leaves inventory or the pack unexplained.
# antitheft.alarm = true

# Comma-separated words from item names to keep in the pack, e.g. "sigil, key". Never
# curatives: those must stay loose to be eaten.
# antitheft.sweep = (none)

# Loose gold older than this is reported and put away. 0 is off.
# antitheft.goldGrace = 5   # s

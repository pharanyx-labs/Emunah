# Emunah -- People and names.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp people` explains each setting; the values shown are the defaults.

# namedb.capture = true

# Look names up against the Achaea web API automatically.
# namedb.autoFetch = true

# names.enabled = true

# Pop up a warning window when ANGEL PRESENCES senses an enemy nearby.
# presences.alert = false

# How long the presence warning stays up without a click. 0 keeps it until clicked.
# presences.alertFor = 15   # s

# names.cityTint = true

# An enemy's name in the game text is a link: click it for their record, as emset whois.
# names.enemyLinks = true

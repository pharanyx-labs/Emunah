# Emunah -- Map.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp map` explains each setting; the values shown are the defaults.

# Check for a new crowdmap on load and every map.checkEvery minutes.
# map.autoupdate = true

# At least 5.
# map.checkEvery = 60   # min

# Show the crowdmap's changelog entries since the last update.
# map.changelog = true

# Correct a room's name, environment, indoors/outdoors and area from GMCP as you walk.
# map.gmcpSync = true

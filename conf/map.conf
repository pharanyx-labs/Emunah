# Emunah -- Map.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp map` explains each setting; the values shown are the defaults.

# Check for a new crowdmap on load and every map.checkEvery minutes.
# map.autoupdate = true

# At least 5.
# map.checkEvery = 60   # min

# Show the crowdmap's changelog entries since the last update.
# map.changelog = true

# Correct a room's name, environment, indoors/outdoors and area from GMCP as you walk.
# map.gmcpSync = true

# The least time between two steps. Faster draws the game's "Now now, don't be so hasty!".
# map.stepGap = 0.5   # s

# Send a step again when no arrival has followed it in this long; twice, then the walk
# stops.
# map.retryAfter = 3   # s

# Show where a walk is going and the steps left at the end of the prompt, then that it
# arrived.
# map.showSteps = true

# Off makes routes avoid water rooms where land is not much longer.
# map.waterwalk = true

# Let routes use wormholes. Off keeps them out, as mmp does by default.
# map.wormholes = false

# Which of mmp's locator lines get room numbers: farsee, view, mindsense, allsight,
# alertness, angel, shrines, shop, who. emset map locators applies a change.
# map.locators = farsee, view, mindsense, allsight, alertness, angel, shrines, shop, who

# How long a located person's room stays lit on the map; 0 never lights it.
# map.trackFor = 5   # min

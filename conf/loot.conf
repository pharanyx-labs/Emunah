# Emunah -- Loot and shopping.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp loot` explains each setting; the values shown are the defaults.

# loot.gold = true

# Only lift gold with nobody else in the room.
# loot.aloneOnly = true

# loot.ownKillsOnly = false

# Do not stop to loot while anything on the kill list is still in the room.
# loot.noDenizens = true

# Gold you take out of the pack yourself (get ... gold) is left in hand this long before
# it goes back. 0 puts it straight back.
# loot.holdTyped = 30   # s

# The one pack, by replica number: gold is stowed in it, purchases are paid from it, and
# antitheft keeps it worn and closed.
# pack.id = backpack452292

# How many items the pack holds. A pack inside it counts as one.
# pack.capacity = 50   # items

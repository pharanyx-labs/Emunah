# Emunah -- Healing: when to sip, eat moss, lay hands and clot.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp curing` explains each setting; the values shown are the defaults.

# Sip health below this.
# curing.healthThreshold = 80   # %

# Sip mana below this. Health comes first: the two share one elixir balance.
# curing.manaThreshold = 85   # %

# Eat irid moss below this, on health or mana.
# curing.iridThreshold = 68   # %

# PERFORM HANDS below this. Costs equilibrium, which attacking also spends, so this is set
# low on purpose.
# curing.handsThreshold = 50   # %

# Eat irid moss at all.
# curing.irid = true

# Bleeding above this is clotted.
# curing.clotThreshold = 30

# Emunah -- PvP.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp pvp` explains each setting; the values shown are the defaults.

# Replaces watch.critical in PvP. Zero disables it.
# pvp.stopBelowHealth = 25   # %

# Show the target's lock afflictions on the prompt: asthma, slickness, anorexia, paralysis and
# impatience, a doubtful one with its chance, and any lock they are in.
# pvp.promptLocks = true

# Perform purity when the target's health is known to be at or under this. Only when the
# game has given their health; zero turns it off.
# pvp.purityBelow = 20   # %

# attack, defence, hinder, finish or offence: what each balance sends. F1-F4 set the first four.
# pvp.mode = offence

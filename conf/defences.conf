# Emunah -- Defences.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp defences` explains each setting; the values shown are the defaults.

# A notice on the chyron while no shield is wielded. Settles on the next inventory change.
# WIELDED is shown at login either way.
# shield.watch = true

# defences.enabled = false

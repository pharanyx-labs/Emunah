# Emunah -- the situational curing rules, and your changes to them.
#
# In force only while `emset ownprios on`. `emset ownprios off` goes back to the rules as
# shipped without touching this file.
#
# A situational rule re-ranks or holds a cure while a situation lasts: inquisition up, low
# health with paralysis, an affliction re-applied every round. The rules, and the evidence
# for each, are in src/emunah/curing/situations.lua and docs/game/curing.md
# ("Situational rules").
#
#   <rule> = off                              switch a rule off
#   <rule>.<affliction>.<balance> = <rank>    change a rank the rule gives, or add one
#
# The shipped rules, as they ship:
#
#   inquisition-unlock        while inquisition: guilt and spiritburn herb 7.5
#   inquisition-burning       while inquisition: the tree is not touched for burning
#                             (salves are shut outright under inquisition; not a rule)
#   paralysis-holds-healing   paralysis below the health-sip threshold: paralysis herb 3.5
#   weariness-reapplied       weariness back within 6s of its cure: weariness herb 69
#   justice-not-attacking     justice while neither PvP nor bashing runs: not cured
#
# Examples:
# justice-not-attacking = off
# inquisition-unlock.guilt.herb = 5
# inquisition-unlock.spiritburn.herb = 5
# paralysis-holds-healing.paralysis.herb = 1

# Emunah -- your own cure priorities.
#
# In force only while `emset ownprios on`. `emset ownprios off` goes back to the shipped
# ranks without touching this file.
#
#   <affliction>.<balance> = <rank>
#
# Lower is cured sooner. Balances: herb, salve, smoke, elixir, purgative, focus, tree,
# special. The shipped ranks are svof's, in src/emunah/curing/afflist.lua; herb runs from 3
# (relapsing) to 68. Use the server's name or Emunah's (weariness and weakness are the
# same). A rank only reorders a cure an affliction already has; it cannot add one.
#
# These apply on top of anything set with `emset prio`, and a situational rule
# (situations.conf) outranks them for as long as it is in force.
#
# Examples:
# paralysis.herb = 3          # bloodroot ahead of asthma's kelp, always
# weariness.herb = 60         # kelp for weariness after almost everything else
# guilt.herb = 20
# masochism.focus = 30

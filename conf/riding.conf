# Emunah -- Riding.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp riding` explains each setting; the values shown are the defaults.

# Vault back onto the mount whenever you are off it and the balance is idle.
# riding.keepup = false

# The mount, as VAULT takes it. Its number is how the room list and ORDER name it.
# riding.mount = horse368644

# Order the mount to follow you whenever it is here and not ridden, and warn on the prompt
# while it is not with you.
# riding.follow = true

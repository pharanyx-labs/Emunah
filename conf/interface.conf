# Emunah -- Interface.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp interface` explains each setting; the values shown are the defaults.

# Whether the panel interface is built at all.
# ui.enabled = true

# ui.map = true

# Clamped to 10-70.
# ui.mapHeight = 42   # % of window

# Detaches the map into its own window. emset ui rebuild after changing it.
# ui.mapFloat = false

# How often balance countdowns redraw while one is running. 0 turns the live countdowns
# off.
# ui.refresh = 0.2   # s

# keys.numpad = true

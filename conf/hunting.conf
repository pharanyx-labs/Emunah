# Emunah -- Hunting: bashing, walking and the damage watch.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp hunting` explains each setting; the values shown are the defaults.

# walker.auto = true

# 0.1 to 30.
# walker.stepDelay = 0.6   # s

# Toggled in-session by emset walk return; not persisted.
# walker.returnToStart = true

# walker.stopBelowHealth = 40   # %

# walker.stopOnPlayer = false

# walker.transitTimeout = 8   # s

# bashing.attack = angel sear

# What the attack REQUIRES: eq, bal or both.
# bashing.balance = both

# What the attack SPENDS: eq or bal. Not the same question as balance.
# bashing.consumes = eq

# Zero disables the floor.
# bashing.stopBelowHealth = 50   # %

# bashing.maxAttempts = 40

# bashing.walkWhenClear = true

# bashing.stopOnPlayer = false

# bashing.soloOnly = true

# How far above the health floor to recover before resuming.
# bashing.resumeMargin = 10   # points

# Priest only.
# bashing.penitence = true

# Priest only.
# bashing.desolation = true

# The floor everything stops at. Zero disables it.
# watch.critical = 30   # %

# watch.damageSpike = 25   # %

# watch.damageWindow = 10   # ticks

# watch.damageSpikeBelow = 60   # %

# watch.endurance = 15   # %

# watch.willpower = 15   # %

# watch.mana = 10   # %

# watch.resource = 10   # %

# denizens.autoRecord = true

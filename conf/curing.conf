# Emunah -- Curing.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp curing` explains each setting; the values shown are the defaults.

# Off by default, deliberately. Curing is opt-in.
# curing.enabled = false

# herbs or minerals. Changes which item every cure resolves to.
# curing.method = herbs

# How long a sent cure holds its vector waiting for the game to confirm it, before the
# vector is re-armed.
# curing.confirmWait = 2   # s

# How often the tracked list is reconciled against Char.Afflictions wholesale.
# curing.reconcileEvery = 20   # ticks

# Send DIAG when the affliction list is in doubt -- which is what answers loki, the one
# affliction GMCP does not report honestly.
# curing.diag = true

# curing.focusGuilt = false

# curing.elixirConfirm = 7   # s

# curing.mossConfirm = 9   # s

# curing.riftConfirm = 1.5   # s

# Pull consumables out of the rift as they run low.
# curing.restock = true

# Every prompt by default. It used to be every tenth, which made each pull ten prompts
# apart for no benefit -- only one pull can be in flight anyway.
# curing.restockEvery = 1   # ticks

# curing.restockSalves = false

# How many of each consumable to keep in hand. Ash is kept at 2 at least: crescendo takes
# two in a row.
# curing.stockTarget = 1

# The reference system's anti-illusion: EmunahTriggers.xml reports wait for the prompt and
# a block containing an illusion is discarded whole; a refusal is believed only after a
# command it could answer; a herb balance back within 1.1s of eating is ignored. Ignored
# lines are marked (i). Off believes every line as it arrives.
# curing.antiIllusion = true

# How long an affliction reported by text waits for the server to confirm it before it is
# dropped as an illusion.
# curing.textConfirm = 2   # s

# FOCUS is held at or below this mana (the reference system's manause).
# curing.focusMinMana = 35   # % of max

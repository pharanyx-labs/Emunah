# Emunah -- Pipes.
#
# Uncomment a line to pin that setting. A pinned setting wins over `emset`, which will say
# so rather than appear to work; comment it out again to hand it back. This file is read on
# every load and every `emreload`. Every line ships commented, so it changes nothing until
# you edit it. `emhelp pipes` explains each setting; the values shown are the defaults.

# pipes.enabled = true

# Re-check every pipe this often with PIPELIST. 0 (the default) asks only when the pipes
# are not known, e.g. after login or a reload.
# pipes.poll = 0   # s
